# ffp: FFP-CI-MURUA content-pipeline yaml
name: Murua Tracer Tier-3 Organism Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:



env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  murua-verify:
    name: Polyglot Rust/C/Python Build & SecretShield Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dhūmāvatī SecretShield & Zero-Scraper Check
        run: |
          python3 security/secret_shield.py
          ! grep -rnE "(mailto:|@rasaxmachina\.com|\+372|sk_live_|ghp_[A-Za-z0-9]{20})" src/ python/ README.md SECURITY.md
      - name: Compile C Acoustic Kernel & Check Rust Suite
        run: |
          gcc -O3 -c src/c/tx_srm_acoustic_kernel.c -o /tmp/tx_srm_acoustic_kernel.o
          cargo test --locked || cargo check
      - name: Verify Bayesian UPU CN08 Python Engine
        run: |
          python3 -m py_compile python/*.py
